media:
  input: assets
  output: /assets
  categories: [ image ]

content:
  - name: schedule
    label: Class Schedule
    description: Edit the studio class times shown on the home page.
    type: file
    path: assets/schedule.json
    fields:
      - name: title
        label: Heading
        type: string
        default: STUDIO SCHEDULE
      - name: slots
        label: Classes
        type: object
        list: true
        fields:
          - name: day
            label: Day
            type: string
            description: e.g. Mondays
          - name: time
            label: Time(s)
            type: string
            description: e.g. 9.30am  or  5 + 6.15 + 7.30pm
          - name: studio
            label: Studio
            type: string
            description: e.g. @within
  - name: hero
    label: Homepage Hero Photo
    description: The big photo at the top of the homepage. Use a landscape photo (wider than tall) - straight from your phone is fine, just turn it sideways.
    type: file
    path: assets/hero.json
    fields:
      - name: src
        label: Hero photo
        type: image
        description: Landscape only. Portrait photos will crop badly.
      - name: focus_h
        label: Where is the subject, left to right?
        type: select
        default: 70%
        options:
          values:
            - value: 30%
              label: Left side of the photo
            - value: 50%
              label: Centre
            - value: 70%
              label: Right side of the photo
      - name: focus_v
        label: Where is the subject, top to bottom?
        type: select
        default: 18%
        options:
          values:
            - value: 18%
              label: Near the top
            - value: 45%
              label: Middle
  - name: banners
    label: Page Banner Photos
    description: The wide photo strips at the top of each inner page.
    type: file
    path: assets/banners.json
    fields:
      - name: about
        label: About page banner
        type: object
        fields:
          - { name: src, label: Photo, type: image, description: "Wide landscape photo. Only a horizontal strip shows." }
          - name: focus_v
            label: Where is the subject, top to bottom?
            type: select
            default: 32%
            options:
              values:
                - { value: 32%, label: Current framing }
                - { value: 20%, label: Near the top }
                - { value: 45%, label: Middle }
                - { value: 60%, label: Lower }
      - name: corporate
        label: Corporate Yoga page banner
        type: object
        fields:
          - { name: src, label: Photo, type: image, description: "Wide landscape photo. Only a horizontal strip shows." }
          - name: focus_v
            label: Where is the subject, top to bottom?
            type: select
            default: 28%
            options:
              values:
                - { value: 28%, label: Current framing }
                - { value: 20%, label: Near the top }
                - { value: 45%, label: Middle }
                - { value: 60%, label: Lower }
      - name: private
        label: Privates + Prenatal page banner
        type: object
        fields:
          - { name: src, label: Photo, type: image, description: "Wide landscape photo. Only a horizontal strip shows." }
          - name: focus_v
            label: Where is the subject, top to bottom?
            type: select
            default: 42%
            options:
              values:
                - { value: 42%, label: Current framing }
                - { value: 20%, label: Near the top }
                - { value: 45%, label: Middle }
                - { value: 60%, label: Lower }
      - name: contact
        label: Contact page banner
        type: object
        fields:
          - { name: src, label: Photo, type: image, description: "Wide landscape photo. Only a horizontal strip shows." }
          - name: focus_v
            label: Where is the subject, top to bottom?
            type: select
            default: 46%
            options:
              values:
                - { value: 46%, label: Current framing }
                - { value: 20%, label: Near the top }
                - { value: 45%, label: Middle }
                - { value: 60%, label: Lower }
      - name: cyclical
        label: Cyclical Practice page banner
        type: object
        fields:
          - { name: src, label: Photo (optional), type: image, description: "Leave empty to keep the plain warm background." }
          - name: focus_v
            label: Where is the subject, top to bottom?
            type: select
            default: 40%
            options:
              values:
                - { value: 25%, label: Near the top }
                - { value: 40%, label: Middle }
                - { value: 55%, label: Lower }
  - name: gallery
    label: Photo Gallery (About page)
    description: Add, remove, or reorder the photos in the About-page gallery. Any photo shape works.
    type: file
    path: assets/gallery.json
    fields:
      - name: images
        label: Images
        type: object
        list: true
        fields:
          - name: src
            label: Photo
            type: image
          - name: alt
            label: Description (alt text)
            type: string
            description: Short description for accessibility, e.g. "Alessia in wheel pose"
